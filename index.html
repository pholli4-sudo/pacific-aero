<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>Pacific Aero</title>
  <meta name="description" content="Pacific Aero" />
  <style>
    :root { --ink: #0A1F44; --muted: #4A5568; --accent: #F28C28; --bg1: #BFD9F5; --bg2: #F2F8FD; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg1) 0%, #DCEBFA 45%, var(--bg2) 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    main { max-width: 640px; width: 100%; }
    .mark { display: flex; align-items: flex-end; gap: 10px; }
    .mark svg { width: 44px; height: 44px; display: block; }
    .mark h1 { margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -1.4px; line-height: 1; }
    .rule { width: 56px; height: 4px; background: var(--accent); margin: 26px 0; border-radius: 2px; }
    p { font-size: 19px; line-height: 1.55; color: var(--muted); margin: 0 0 14px; }
    a { color: var(--ink); font-weight: 600; text-decoration: none; border-bottom: 2px solid var(--accent); }
    footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
    @media (max-width: 480px) { .mark h1 { font-size: 34px; } p { font-size: 17px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="Pacific Aero">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M0 100 A100 100 0 0 1 100 0 L100 100 Z" fill="#0A1F44"/></svg>
      <h1>Pacific Aero</h1>
    </div>
    <div class="rule"></div>
    <p>Independent consulting for aerospace supply chains: sourcing, supplier quality, and material provenance.</p>
    <p>Engagements are by introduction. Write to <a href="mailto:contact@pacific-aero.com">contact@pacific-aero.com</a>.</p>
    <footer>Pacific Aero. This page is not listed in search engines.</footer>
  </main>
</body>
</html>
